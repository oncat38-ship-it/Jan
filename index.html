<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAN Master Pro - レジ業務サポート</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Html5-Qrcode for Camera Scanning -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- JsBarcode for rendering barcodes -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <style>
        .active-tab {
            border-bottom: 3px solid #2563eb;
            color: #2563eb;
            font-weight: bold;
        }
        #reader video {
            object-fit: cover !important;
            border-radius: 0.75rem;
            width: 100% !important;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col pb-16 md:pb-0">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-barcode text-2xl"></i>
                <h1 class="font-bold text-xl tracking-wide">JAN Master Pro</h1>
            </div>
            <span class="text-xs bg-blue-700 px-2.5 py-1 rounded-full text-blue-100 font-medium">Webブラウザ対応</span>
        </div>
    </header>

    <!-- Main Navigation Bar -->
    <nav class="bg-white border-b border-slate-200 sticky top-[52px] z-40 shadow-sm overflow-x-auto">
        <div class="max-w-4xl mx-auto flex whitespace-nowrap text-sm text-slate-600 font-medium">
            <button onclick="switchTab('scan')" id="tab-scan" class="flex-1 py-3 px-3 text-center active-tab hover:bg-slate-50 transition">
                <i class="fa-solid fa-camera mr-1"></i>カメラ・結果
            </button>
            <button onclick="switchTab('search')" id="tab-search" class="flex-1 py-3 px-3 text-center hover:bg-slate-50 transition">
                <i class="fa-solid fa-magnifying-glass mr-1"></i>検索・登録
            </button>
            <button onclick="switchTab('predict')" id="tab-predict" class="flex-1 py-3 px-3 text-center hover:bg-slate-50 transition">
                <i class="fa-solid fa-boxes-packing mr-1"></i>単品⇔箱
            </button>
            <button onclick="switchTab('itf')" id="tab-itf" class="flex-1 py-3 px-3 text-center hover:bg-slate-50 transition">
                <i class="fa-solid fa-arrow-right-arrow-left mr-1"></i>ITF変換
            </button>
            <button onclick="switchTab('missing')" id="tab-missing" class="flex-1 py-3 px-3 text-center hover:bg-slate-50 transition">
                <i class="fa-solid fa-circle-question mr-1"></i>欠損予測
            </button>
            <button onclick="switchTab('fav')" id="tab-fav" class="flex-1 py-3 px-3 text-center hover:bg-slate-50 transition">
                <i class="fa-solid fa-layer-group mr-1 text-amber-500"></i>JAN無し
            </button>
            <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-3 px-3 text-center hover:bg-slate-50 transition">
                <i class="fa-solid fa-history mr-1"></i>履歴
            </button>
        </div>
    </nav>

    <!-- Content Area -->
    <main class="max-w-4xl mx-auto w-full flex-grow p-4 space-y-6">

        <!-- 1. SCANNER & QUICK ACTION SECTION -->
        <section id="section-scan" class="space-y-4">
            <!-- Camera Scanner Box -->
            <div class="bg-white rounded-xl shadow p-4 border border-slate-200">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-camera text-blue-600"></i> バーコード読み取り
                    </h2>
                    <span id="scan-status" class="text-xs px-2 py-1 bg-emerald-100 text-emerald-800 rounded-full font-semibold">待機中</span>
                </div>
                
                <div id
