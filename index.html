<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAN Master Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>window.Html5Qrcode || document.write('<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"><\/script>')</script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBQHt-75N1TLsVzflkkodbADpqMSK3bDmw",
    authDomain: "pass-2feef.firebaseapp.com",
    projectId: "pass-2feef",
    storageBucket: "pass-2feef.firebasestorage.app",
    messagingSenderId: "928726808124",
    appId: "1:928726808124:web:db251feec25d99f9faf539",
    measurementId: "G-9KN1MHPB4S"
  };

  let dbFirestore;
  try {
    const app = initializeApp(firebaseConfig);
    dbFirestore = getFirestore(app);
    window.firebaseEnabled = true;
  } catch (e) {
    console.warn("Firebase not initialized:", e);
  }

  window.firebaseAuth = { dbFirestore, doc, setDoc, getDoc, onSnapshot };
</script>

<style>
.active-tab{border-bottom:3px solid #2563eb;color:#2563eb;font-weight:bold}
#reader video{border-radius:.75rem; object-fit: cover;}
</style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col pb-16 md:pb-0">

<header class="bg-blue-600 text-white shadow-md sticky top-0 z-50">
  <div class="max-w-4xl mx-auto px-4 py-2 flex justify-between items-center">
    <div class="flex items-center space-x-2"><i class="fa-solid fa-barcode text-2xl"></i><h1 class="font-bold text-xl tracking-wide">JAN Master Pro</h1></div>
    <div class="flex items-center gap-2">
      <button onclick="toggleCalcModal()" class="text-xs bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded-full text-blue-100 font-medium flex items-center gap-1 transition">
        <i class="fa-solid fa-calculator"></i> 箱計算
      </button>
      <button onclick="toggleAccountModal()" id="btn-account-status" class="text-xs bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded-full text-blue-100 font-medium flex items-center gap-1.5 transition">
        <i class="fa-solid fa-key"></i> <span id="account-status-text">オフライン保存</span>
      </button>
    </div>
  </div>
</header>

<nav class="bg-white border-b border-slate-200 sticky top-[48px] z-40 shadow-sm overflow-x-auto">
  <div class="max-w-4xl mx-auto flex whitespace-nowrap text-sm text-slate-600 font-medium">
    <button onclick="switchTab('scan')" id="tab-scan" class="flex-1 py-3 px-3 text-center active-tab hover:bg-slate-50 transition"><i class="fa-solid fa-camera mr-1"></i>カメラ・結果</button>
    <button onclick="switchTab('fav')" id="tab-fav" class="flex-1 py-3 px-3 text-center hover:bg-slate-50 transition"><i class="fa-solid fa-layer-group mr-1 text-amber-500"></i>JAN無し</button>
    <button onclick="switchTab('predict')" id="tab-predict" class="flex-1 py-3 px-3 text-center hover:bg-slate-50 transition"><i class="fa-solid fa-boxes-packing mr-1"></i>単品⇔箱・管理</button>
    <button onclick="switchTab('itf')" id="tab-itf" class="flex-1 py-3 px-3 text-center hover:bg-slate-50 transition"><i class="fa-solid fa-arrow-right-arrow-left mr-1"></i>ITF変換</button>
    <button onclick="switchTab('missing')" id="tab-missing" class="flex-1 py-3 px-3 text-center hover:bg-slate-50 transition"><i class="fa-solid fa-circle-question mr-1"></i>欠損予測</button>
    <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-3 px-3 text-center hover:bg-slate-50 transition"><i class="fa-solid fa-history mr-1"></i>履歴</button>
  </div>
</nav>

<main class="max-w-4xl mx-auto w-full flex-grow p-4 space-y-6">

  <!-- 1. SCAN -->
  <section id="section-scan" class="space-y-4">
    <div class="bg-white rounded-xl shadow p-4 border border-slate-200">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-camera text-blue-600"></i> 高精度スキャナー</h2>
        <span id="scan-status" class="text-xs px-2 py-1 bg-emerald-100 text-emerald-800 rounded-full font-semibold">待機中</span>
      </div>
      <div id="reader-container" class="relative overflow-hidden rounded-lg bg-black min-h-[300px] flex items-center justify-center">
        <div id="reader" class="w-full"></div>
        <div id="camera-placeholder" class="text-white text-center p-6 space-y-3">
          <i class="fa-solid fa-barcode text-5xl text-slate-400"></i>
          <p class="text-xs text-slate-400">JAN13 / JAN8 / ITF14 高感度自動読み取り</p>
        </div>
      </div>
      <div class="mt-3 flex gap-2">
        <button id="btn-toggle-camera" onclick="toggleCamera()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 transition">
          <i class="fa-solid fa-power-off"></i> <span>カメラ起動</span>
        </button>
      </div>
      <div id="cam-tools" class="mt-2 items-center gap-3" style="display:none">
        <button id="btn-torch" onclick="toggleTorch()" class="px-3 py-2 bg-amber-100 text-amber-800 rounded-lg text-xs font-bold" style="display:none"><i class="fa-solid fa-lightbulb"></i> ライト</button>
        <label id="zoom-wrap" class="flex-1 items-center gap-2 text-xs text-slate-500" style="display:none">
          <i class="fa-solid fa-magnifying-glass-plus"></i>
          <input id="zoom-range" type="range" class="flex-1" oninput="setZoom(this.value)">
        </label>
      </div>
    </div>

    <!-- スキャン結果カード (3つの選択肢に絞り込み) -->
    <div id="scan-result-card" class="bg-white rounded-xl shadow-lg border-2 border-blue-500 p-5 hidden space-y-4">
      <div class="flex justify-between items-start border-b pb-3">
        <div>
          <span class="text-xs font-bold text-blue-600 uppercase tracking-wider">スキャン結果</span>
          <div class="text-2xl font-black text-slate-900 font-mono tracking-widest mt-0.5" id="scan-code-val">----</div>
        </div>
        <button onclick="closeScanResult()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <div class="bg-slate-50 p-3 rounded-lg flex flex-col items-center justify-center border border-slate-200">
        <svg id="scan-barcode-svg" class="max-w-full"></svg>
        <span id="barcode-error-msg" class="text-xs text-red-500 mt-1 hidden">エラー: 無効な形式です</span>
      </div>
      <div class="space-y-2">
        <div class="grid grid-cols-2 gap-2">
          <button onclick="actionFromScan('predict')" class="bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 text-indigo-800 p-2.5 rounded-lg text-left flex items-center gap-2.5 transition">
            <i class="fa-solid fa-boxes-packing text-indigo-600 text-lg"></i><div class="text-xs font-bold">単品 ⇔ 箱JAN予測</div>
          </button>
          <button onclick="actionFromScan('itf')" class="bg-teal-50 hover:bg-teal-100 border border-teal-200 text-teal-800 p-2.5 rounded-lg text-left flex items-center gap-2.5 transition">
            <i class="fa-solid fa-arrow-right-arrow-left text-teal-600 text-lg"></i><div class="text-xs font-bold">ITF 14桁 変換</div>
          </button>
        </div>
        <button onclick="openScanToFavModal()" class="w-full bg-emerald-50 hover:bg-emerald-100 border border-emerald-300 text-emerald-800 font-bold py-2.5 px-3 rounded-lg flex items-center justify-center gap-2 text-sm transition">
          <i class="fa-solid fa-layer-group text-amber-500"></i> 「JAN無し」リストに保存 (写真撮影可)
        </button>
      </div>
    </div>
  </section>

  <!-- 2. JAN-NASHI (写真・名前編集機能追加／JANコード表記変更) -->
  <section id="section-fav" class="space-y-4 hidden">
    <div class="bg-white rounded-xl shadow p-4 border border-slate-200 space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-layer-group text-amber-500"></i> JAN無し商品管理</h2>
        <button onclick="openFavForm(null)" class="text-xs bg-amber-500 hover:bg-amber-600 text-white font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 transition">
          <i class="fa-solid fa-plus"></i> 新規追加
        </button>
      </div>

      <!-- 新規・編集フォーム -->
      <div id="fav-form-container" class="hidden bg-amber-50/50 p-3.5 rounded-lg border border-amber-200 space-y-3 text-sm">
        <h3 id="fav-form-title" class="font-bold text-amber-900 text-xs flex items-center gap-1"><i class="fa-solid fa-pen"></i> JAN無し商品の登録</h3>
        <input type="hidden" id="fav-input-id" value="">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">商品名 *</label>
          <input type="text" id="fav-input-name" placeholder="例：特売キャベツ 1玉" class="w-full border rounded-lg px-3 py-1.5 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">JANコード (任意)</label>
          <input type="text" id="fav-input-jan" placeholder="自動採番または独自コード" class="w-full border rounded-lg px-3 py-1.5 text-sm font-mono">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">商品画像</label>
          <input type="file" id="fav-input-image" accept="image/*" onchange="previewFavImage(this)" class="w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-amber-100 file:text-amber-700 hover:file:bg-amber-200">
          <div id="fav-img-preview-wrap" class="mt-2 hidden flex items-center gap-2">
            <img id="fav-img-preview" class="w-16 h-16 object-cover rounded-lg border">
            <button type="button" onclick="clearFavImage()" class="text-xs text-red-500 hover:underline">画像を削除</button>
          </div>
        </div>
        <div class="flex gap-2 justify-end pt-1">
          <button onclick="closeFavForm()" class="px-3 py-1.5 bg-slate-200 text-slate-700 text-xs font-bold rounded-lg">キャンセル</button>
          <button onclick="saveCustomFavorite()" class="px-4 py-1.5 bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold rounded-lg">保存</button>
        </div>
      </div>

      <div class="flex gap-2">
        <input type="text" id="fav-search-input" oninput="renderFavorites()" placeholder="JAN無し商品の名前またはコードを検索" class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
      </div>
    </div>

    <div id="fav-grid" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
  </section>

  <!-- 3. PREDICT & MANAGEMENT (単品⇔箱JAN予測 ＋ 検索・修正機能) -->
  <section id="section-predict" class="space-y-4 hidden">
    <div class="bg-white rounded-xl shadow p-4 border border-slate-200 space-y-3">
      <h2 class="font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-boxes-packing text-indigo-600"></i> 単品 ⇔ 箱JAN 予測 (±1)</h2>
      <div class="space-y-2">
        <input type="text" id="predict-input" placeholder="JANコード" class="w-full border rounded-lg px-3 py-2 text-sm font-mono">
        <button onclick="predictBoxJan()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-lg text-sm">計算 (±1)</button>
      </div>
    </div>
    <div id="predict-results" class="space-y-2"></div>

    <!-- 商品管理・検索・修正枠 -->
    <div class="bg-white rounded-xl shadow p-4 border border-slate-200 space-y-3">
      <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2 border-b pb-2"><i class="fa-solid fa-sliders text-blue-600"></i> 登録商品の検索・修正</h3>
      <div class="flex gap-2">
        <input type="text" id="manage-search-input" oninput="searchManageItem()" placeholder="商品名またはJANコード" class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div id="manage-result-list" class="space-y-2 pt-1"></div>
    </div>

    <!-- 編集フォーム -->
    <div id="manage-form-container" class="bg-white rounded-xl shadow p-4 border border-slate-200 space-y-3 hidden">
      <h3 class="font-bold text-slate-800 border-b pb-2 text-sm flex justify-between items-center">
        <span><i class="fa-solid fa-pen-to-square text-blue-600"></i> 商品情報の修正</span>
        <button onclick="closeManageForm()" class="text-xs text-slate-500 hover:text-slate-700">キャンセル</button>
      </h3>
      <form id="manage-product-form" onsubmit="saveManageProduct(event)" class="space-y-3 text-sm">
        <input type="hidden" id="mp-id" value="">
        <div><label class="block text-xs font-semibold text-slate-600 mb-1">商品名 *</label>
          <input type="text" id="mp-name" required placeholder="商品名" class="w-full border rounded-lg px-3 py-2 text-sm"></div>
        <div class="grid grid-cols-2 gap-2">
          <div><label class="block text-xs font-semibold text-slate-600 mb-1">単品JAN *</label>
            <input type="text" id="mp-jan" required placeholder="13桁/8桁" class="w-full border rounded-lg px-3 py-2 text-sm font-mono"></div>
          <div><label class="block text-xs font-semibold text-slate-600 mb-1">箱JAN・ITF</label>
            <input type="text" id="mp-boxjan" placeholder="14桁" class="w-full border rounded-lg px-3 py-2 text-sm font-mono"></div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div><label class="block text-xs font-semibold text-slate-600 mb-1">単品価格 (円)</label>
            <input type="number" id="mp-price" placeholder="0" class="w-full border rounded-lg px-3 py-2 text-sm"></div>
          <div><label class="block text-xs font-semibold text-slate-600 mb-1">入数</label>
            <input type="number" id="mp-qty" placeholder="0" class="w-full border rounded-lg px-3 py-2 text-sm"></div>
        </div>
        <div><label class="block text-xs font-semibold text-slate-600 mb-1">メモ</label>
          <input type="text" id="mp-memo" placeholder="メモ" class="w-full border rounded-lg px-3 py-2 text-sm"></div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg transition">変更を保存</button>
      </form>
    </div>
  </section>

  <!-- 4. ITF -->
  <section id="section-itf" class="space-y-4 hidden">
    <div class="bg-white rounded-xl shadow p-4 border border-slate-200 space-y-3">
      <h2 class="font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-arrow-right-arrow-left text-teal-600"></i> ITF / JAN 相互変換</h2>
      <div class="space-y-2">
        <input type="text" id="itf-input" placeholder="ITF (14桁) または JAN (13桁)" class="w-full border rounded-lg px-3 py-2 text-sm font-mono">
        <div class="grid grid-cols-2 gap-2">
          <button onclick="convertITF('toJAN')" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 rounded-lg text-xs">ITF → JAN 変換</button>
          <button onclick="convertITF('toITF')" class="bg-teal-800 hover:bg-teal-900 text-white font-bold py-2 rounded-lg text-xs">JAN → ITF14 変換</button>
        </div>
      </div>
    </div>
    <div id="itf-result" class="bg-white rounded-xl shadow p-4 border border-slate-200 hidden space-y-3">
      <div class="p-3 bg-slate-50 rounded-lg space-y-1">
        <div class="text-xs text-slate-500" id="itf-res-label">変換結果</div>
        <div class="text-xl font-bold font-mono text-teal-700" id="itf-res-val">---</div>
        <div class="text-xs" id="itf-check-status">---</div>
      </div>
      <div class="flex justify-center bg-white p-2 border rounded"><svg id="itf-res-barcode"></svg></div>
    </div>
  </section>

  <!-- 5. MISSING -->
  <section id="section-missing" class="space-y-4 hidden">
    <div class="bg-white rounded-xl shadow p-4 border border-slate-200 space-y-3">
      <h2 class="font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-circle-question text-amber-600"></i> 欠損JAN予測</h2>
      <div class="space-y-2">
        <input type="text" id="missing-input" placeholder="例: 49012?456789? (?/∗使用)" class="w-full border rounded-lg px-3 py-2 text-sm font-mono">
        <button onclick="solveMissingJan()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2 rounded-lg text-sm">候補計算</button>
      </div>
    </div>
    <div id="missing-results" class="space-y-2"></div>
  </section>

  <!-- 6. HISTORY -->
  <section id="section-history" class="space-y-4 hidden">
    <div class="flex justify-between items-center">
      <h2 class="font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-history text-slate-600"></i> 履歴</h2>
      <button onclick="clearHistory()" class="text-xs text-red-600 hover:underline">消去</button>
    </div>
    <div id="history-list" class="space-y-2"></div>
  </section>
</main>

<!-- Modals -->

<!-- 簡単箱計算モーダル -->
<div id="calc-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
  <div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
    <div class="flex justify-between items-center border-b pb-2">
      <h3 class="font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-calculator text-blue-600"></i> 簡易箱計算ツール</h3>
      <button onclick="toggleCalcModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-xl"></i></button>
    </div>
    
    <div class="flex bg-slate-100 p-1 rounded-xl gap-1">
      <button id="calc-mode-box" onclick="setCalcMode('box')" class="flex-1 py-1.5 text-xs font-bold rounded-lg bg-white shadow-sm text-blue-600">単品 ➔ 箱価格</button>
      <button id="calc-mode-unit" onclick="setCalcMode('unit')" class="flex-1 py-1.5 text-xs font-bold rounded-lg text-slate-600">箱 ➔ 単品価格</button>
    </div>

    <div class="space-y-3 text-sm">
      <div>
        <label id="quick-input-label" class="block text-xs font-semibold text-slate-600 mb-1">単品価格 (円)</label>
        <input type="number" id="quick-price" oninput="runQuickCalc()" placeholder="例: 120" class="w-full border rounded-lg px-3 py-2">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">入数 (個/箱)</label>
        <input type="number" id="quick-qty" oninput="runQuickCalc()" placeholder="例: 24" class="w-full border rounded-lg px-3 py-2">
      </div>
      <div class="bg-blue-50 border border-blue-200 rounded-xl p-3 text-center space-y-1">
        <span id="quick-result-label" class="text-xs text-blue-700 font-bold">計算結果 (箱単価)</span>
        <div class="text-2xl font-black font-mono text-blue-800" id="quick-total-display">¥0</div>
      </div>
    </div>
    <button onclick="toggleCalcModal()" class="w-full bg-slate-800 text-white font-bold py-2 rounded-lg text-sm">閉じる</button>
  </div>
</div>

<div id="barcode-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
  <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl">
    <div class="flex justify-between items-center border-b pb-2">
      <h3 id="modal-title" class="font-bold text-slate-800">バーコード表示</h3>
      <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-xl"></i></button>
    </div>
    <div class="bg-slate-50 p-4 rounded-xl border flex flex-col items-center justify-center"><svg id="modal-barcode-svg"></svg></div>
    <div id="modal-subtext" class="text-xs font-mono text-slate-500"></div>
    <button onclick="closeModal()" class="w-full bg-slate-800 text-white font-bold py-2.5 rounded-lg">閉じる</button>
  </div>
</div>

<div id="account-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
  <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
    <div class="flex justify-between items-center border-b pb-2">
      <h3 class="font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-key text-blue-600"></i> データ同期</h3>
      <button onclick="toggleAccountModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-xl"></i></button>
    </div>
    
    <div id="account-login-view" class="space-y-3">
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-700">合言葉（グループID）</label>
        <input type="text" id="acc-group-id" placeholder="合言葉を入力" class="w-full border rounded-lg px-3 py-2 text-sm font-mono">
        <button onclick="connectSimpleGroup()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-xs transition">同期開始</button>
      </div>
    </div>

    <div id="account-logged-view" class="space-y-3 hidden">
      <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-lg text-xs text-emerald-800 space-y-1">
        <p class="font-bold"><i class="fa-solid fa-check-circle"></i> 同期中</p>
        <p>合言葉: <span id="group-id-display" class="font-mono font-semibold text-base text-emerald-900"></span></p>
      </div>
      <button onclick="disconnectGroup()" class="w-full bg-red-50 hover:bg-red-100 text-red-600 font-bold py-2 rounded-lg text-xs border border-red-200">同期解除</button>
    </div>
  </div>
</div>

<script>
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function loadJson(key) {
  try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch (_) { return []; }
}

let currentGroupId = localStorage.getItem('jan_group_id') || null;
let unsubscribeSnapshot = null;
let db = { products: loadJson('jan_products'), favorites: loadJson('jan_favorites'), history: loadJson('jan_history') };
let html5QrcodeScanner = null, isScanning = false, starting = false, torchOn = false;
let lastScannedCode = "", lastRead = "", sameCount = 0;
let calcMode = 'box';
let currentBase64Image = "";

if (db.products.length === 0) {
  db.products = [
    { id: '1', name: '緑茶 500ml', jan: '4901234567890', boxJan: '14901234567897', price: 140, qty: 24, memo: '常温棚 A-1' },
    { id: '2', name: 'ポテトチップス', jan: '4909876543210', boxJan: '14909876543217', price: 120, qty: 12, memo: 'お菓子コーナー' }
  ];
  saveDb();
}

function saveDb() {
  try {
    localStorage.setItem('jan_products', JSON.stringify(db.products));
    localStorage.setItem('jan_favorites', JSON.stringify(db.favorites));
    localStorage.setItem('jan_history', JSON.stringify(db.history));
  } catch (_) {}

  if (currentGroupId && window.firebaseEnabled) {
    const { dbFirestore, doc, setDoc } = window.firebaseAuth;
    setDoc(doc(dbFirestore, "groups", currentGroupId), {
      products: db.products,
      favorites: db.favorites,
      updatedAt: new Date().toISOString()
    }, { merge: true }).catch(err => console.error("Cloud save failed:", err));
  }
}

window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    if (currentGroupId && window.firebaseEnabled) {
      startGroupSync(currentGroupId);
    }
  }, 500);
});

function connectSimpleGroup() {
  const groupId = document.getElementById('acc-group-id').value.trim();
  if (!groupId) return alert('合言葉を入力してください');
  if (!window.firebaseEnabled) return alert("Firebaseが設定されていません。");
  
  localStorage.setItem('jan_group_id', groupId);
  currentGroupId = groupId;
  startGroupSync(groupId);
  toggleAccountModal();
}

function startGroupSync(groupId) {
  const { dbFirestore, doc, onSnapshot } = window.firebaseAuth;
  
  document.getElementById('account-status-text').textContent = '同期: ' + groupId;
  document.getElementById('btn-account-status').className = 'text-xs bg-emerald-600 hover:bg-emerald-700 px-3 py-1.5 rounded-full text-white font-medium flex items-center gap-1.5 transition';
  document.getElementById('group-id-display').textContent = groupId;
  document.getElementById('account-login-view').classList.add('hidden');
  document.getElementById('account-logged-view').classList.remove('hidden');

  if (unsubscribeSnapshot) unsubscribeSnapshot();

  unsubscribeSnapshot = onSnapshot(doc(dbFirestore, "groups", groupId), (snapshot) => {
    if (snapshot.exists()) {
      const data = snapshot.data();
      if (data.products) db.products = data.products;
      if (data.favorites) db.favorites = data.favorites;
      saveDbToLocalOnly();
      renderFavorites();
      searchManageItem();
    } else {
      saveDb();
    }
  });
}

function disconnectGroup() {
  if (unsubscribeSnapshot) unsubscribeSnapshot();
  localStorage.removeItem('jan_group_id');
  currentGroupId = null;
  document.getElementById('account-status-text').textContent = 'オフライン保存';
  document.getElementById('btn-account-status').className = 'text-xs bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded-full text-blue-100 font-medium flex items-center gap-1.5 transition';
  document.getElementById('account-login-view').classList.remove('hidden');
  document.getElementById('account-logged-view').classList.add('hidden');
  toggleAccountModal();
}

function saveDbToLocalOnly() {
  try {
    localStorage.setItem('jan_products', JSON.stringify(db.products));
    localStorage.setItem('jan_favorites', JSON.stringify(db.favorites));
  } catch (_) {}
}

function toggleAccountModal() { document.getElementById('account-modal').classList.toggle('hidden'); }
function toggleCalcModal() { document.getElementById('calc-modal').classList.toggle('hidden'); }

function setCalcMode(mode) {
  calcMode = mode;
  const btnBox = document.getElementById('calc-mode-box');
  const btnUnit = document.getElementById('calc-mode-unit');
  const labelInput = document.getElementById('quick-input-label');
  const labelResult = document.getElementById('quick-result-label');

  if (mode === 'box') {
    btnBox.className = "flex-1 py-1.5 text-xs font-bold rounded-lg bg-white shadow-sm text-blue-600";
    btnUnit.className = "flex-1 py-1.5 text-xs font-bold rounded-lg text-slate-600";
    labelInput.textContent = "単品価格 (円)";
    labelResult.textContent = "計算結果 (箱単価)";
  } else {
    btnUnit.className = "flex-1 py-1.5 text-xs font-bold rounded-lg bg-white shadow-sm text-blue-600";
    btnBox.className = "flex-1 py-1.5 text-xs font-bold rounded-lg text-slate-600";
    labelInput.textContent = "箱価格 (円)";
    labelResult.textContent = "計算結果 (単品単価)";
  }
  runQuickCalc();
}

function runQuickCalc() {
  const inputVal = parseFloat(document.getElementById('quick-price').value) || 0;
  const q = parseFloat(document.getElementById('quick-qty').value) || 0;
  let total = (calcMode === 'box') ? (inputVal * q) : (q > 0 ? (inputVal / q) : 0);
  document.getElementById('quick-total-display').textContent = '¥' + Math.round(total).toLocaleString();
}

function switchTab(tabId) {
  if (tabId !== 'scan' && isScanning) stopCamera();
  document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab'));
  document.getElementById(`section-${tabId}`).classList.remove('hidden');
  document.getElementById(`tab-${tabId}`).classList.add('active-tab');
  if (tabId === 'fav') renderFavorites();
  if (tabId === 'history') renderHistory();
  if (tabId === 'predict') searchManageItem();
}

function calcCheckDigit(codeWithoutCD) {
  const rev = String(codeWithoutCD).split('').reverse();
  let sum = 0;
  for (let i = 0; i < rev.length; i++) {
    const n = parseInt(rev[i], 10);
    if (isNaN(n)) return null;
    sum += (i % 2 === 0) ? n * 3 : n;
  }
  return (10 - (sum % 10)) % 10;
}
function isValidJan(code) {
  if (!/^(\d{8}|\d{12}|\d{13}|\d{14})$/.test(code)) return false;
  return calcCheckDigit(code.slice(0, -1)) === parseInt(code.slice(-1), 10);
}

/* カメラ精度・解像度・光調整の最適化スキャナー */
function toggleCamera() { isScanning ? stopCamera() : startCamera(); }

function createScanner() {
  const F = Html5QrcodeSupportedFormats;
  return new Html5Qrcode("reader", {
    formatsToSupport: [F.EAN_13, F.EAN_8, F.ITF],          
    experimentalFeatures: { useBarCodeDetectorIfSupported: true },  
    verbose: false
  });
}

function onDecoded(text) {
  if (!isScanning) return;
  let code = String(text).trim();
  if (!/^\d+$/.test(code) || !isValidJan(code)) return;
  if (code.length === 12) code = '0' + code;
  if (code === lastRead) sameCount++; else { lastRead = code; sameCount = 1; }
  if (sameCount < 1) return;
  lastRead = ""; sameCount = 0;
  onScanSuccess(code);
}

async function startCamera() {
  if (starting) return;
  if (typeof Html5Qrcode === "undefined") {
    alert("ライブラリのロードに失敗しました。");
    return;
  }
  starting = true;
  document.getElementById('camera-placeholder').classList.add('hidden');
  document.getElementById('scan-status').textContent = '起動中...';
  document.getElementById('scan-status').className = 'text-xs px-2 py-1 bg-amber-100 text-amber-800 rounded-full font-semibold animate-pulse';

  const baseConfig = {
    fps: 30, // 密度向上と高速認識のためフレームレート向上
    qrbox: (w, h) => ({ width: Math.floor(w * 0.85), height: Math.floor(h * 0.5) }),
    aspectRatio: 1.0
  };
  
  // 高解像度・フォーカス・露出補正を含む高度カメラパラメーター
  const hiResConstraints = { 
    facingMode: "environment", 
    width: { ideal: 1920, min: 1280 }, 
    height: { ideal: 1080, min: 720 },
    focusMode: { ideal: "continuous" },
    exposureMode: { ideal: "continuous" }
  };

  const attempts = [
    () => [{ facingMode: { exact: "environment" } }, { ...baseConfig, videoConstraints: hiResConstraints }],
    () => [{ facingMode: "environment" }, { ...baseConfig, videoConstraints: hiResConstraints }],
    () => [{ facingMode: "environment" }, baseConfig],
    () => [true, baseConfig]
  ];

  let started = false;
  for (const make of attempts) {
    try {
      html5QrcodeScanner = createScanner();
      const [cam, cfg] = make();
      isScanning = true;
      await html5QrcodeScanner.start(cam, cfg, onDecoded);
      started = true;
      break;
    } catch (e) {
      isScanning = false;
      try { html5QrcodeScanner.clear(); } catch (_) {}
    }
  }

  starting = false;
  if (!started) {
    alert("カメラを起動できませんでした。権限またはカメラ環境を確認してください。");
    resetCameraUI();
    return;
  }
  document.getElementById('btn-toggle-camera').innerHTML = '<i class="fa-solid fa-stop"></i> <span>スキャン停止</span>';
  document.getElementById('btn-toggle-camera').className = 'flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 transition';
  document.getElementById('scan-status').textContent = 'スキャン中';
  setupCameraTools();
}

async function setupCameraTools() {
  try {
    const caps = html5QrcodeScanner.getRunningTrackCameraCapabilities();
    const torch = caps.torchFeature(), zoom = caps.zoomFeature();
    document.getElementById('btn-torch').style.display = torch.isSupported() ? 'block' : 'none';
    if (zoom.isSupported()) {
      const r = document.getElementById('zoom-range');
      r.min = zoom.min(); r.max = zoom.max(); r.step = zoom.step() || 0.1; r.value = zoom.min();
      document.getElementById('zoom-wrap').style.display = 'flex';
    } else {
      document.getElementById('zoom-wrap').style.display = 'none';
    }
    document.getElementById('cam-tools').style.display = (torch.isSupported() || zoom.isSupported()) ? 'flex' : 'none';
  } catch (_) {}
}

function toggleTorch() {
  try { torchOn = !torchOn; html5QrcodeScanner.getRunningTrackCameraCapabilities().torchFeature().apply(torchOn); } catch (_) {}
}
function setZoom(v) {
  try { html5QrcodeScanner.getRunningTrackCameraCapabilities().zoomFeature().apply(Number(v)); } catch (_) {}
}

function stopCamera() {
  const s = html5QrcodeScanner;
  isScanning = false;
  html5QrcodeScanner = null;
  if (!s) { resetCameraUI(); return; }
  s.stop().catch(e => console.error(e)).finally(() => {
    try { s.clear(); } catch (_) {}
    resetCameraUI();
  });
}

function resetCameraUI() {
  isScanning = false; starting = false; torchOn = false; lastRead = ""; sameCount = 0;
  document.getElementById('cam-tools').style.display = 'none';
  document.getElementById('camera-placeholder').classList.remove('hidden');
  document.getElementById('scan-status').textContent = '待機中';
  document.getElementById('scan-status').className = 'text-xs px-2 py-1 bg-emerald-100 text-emerald-800 rounded-full font-semibold';
  document.getElementById('btn-toggle-camera').innerHTML = '<i class="fa-solid fa-power-off"></i> <span>カメラ起動</span>';
  document.getElementById('btn-toggle-camera').className = 'flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 transition';
}

function onScanSuccess(decodedText) {
  stopCamera();
  playBeep();
  if (navigator.vibrate) navigator.vibrate(80);
  lastScannedCode = decodedText;
  addHistory('カメラ読取', decodedText);
  document.getElementById('scan-result-card').classList.remove('hidden');
  document.getElementById('scan-code-val').textContent = decodedText;
  const svgEl = document.getElementById('scan-barcode-svg');
  const errEl = document.getElementById('barcode-error-msg');
  try {
    let format = "EAN13";
    if (decodedText.length === 8) format = "EAN8";
    if (decodedText.length === 14) format = "ITF14";
    JsBarcode(svgEl, decodedText, { format, width: 2, height: 60, displayValue: true });
    errEl.classList.add('hidden');
  } catch (e) {
    try {
      JsBarcode(svgEl, decodedText, { format: "CODE128", width: 2, height: 60, displayValue: true });
      errEl.classList.add('hidden');
    } catch (err) { errEl.classList.remove('hidden'); }
  }
}
function closeScanResult() { document.getElementById('scan-result-card').classList.add('hidden'); }

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(1000, ctx.currentTime);
    osc.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.15);
  } catch (e) {}
}

function actionFromScan(targetTab) {
  if (!lastScannedCode) return;
  switchTab(targetTab);
  if (targetTab === 'predict') {
    document.getElementById('predict-input').value = lastScannedCode;
    predictBoxJan();
  } else if (targetTab === 'itf') {
    document.getElementById('itf-input').value = lastScannedCode;
  }
}

function openScanToFavModal() {
  if (!lastScannedCode) return;
  switchTab('fav');
  openFavForm(null, lastScannedCode);
}

function appendCodeCard(container, code, label, viewColor, viewTitle, badgeText = '') {
  const div = document.createElement('div');
  div.className = "bg-white p-3.5 rounded-xl border border-slate-200 flex justify-between items-center shadow-sm";
  div.innerHTML = `
    <div>
      <div class="flex items-center gap-1.5 mb-0.5">
        ${label ? `<span class="text-xs font-bold text-slate-700">${esc(label)}</span>` : ''}
        ${badgeText ? `<span class="text-[10px] bg-indigo-100 text-indigo-800 font-bold px-2 py-0.5 rounded-full">${esc(badgeText)}</span>` : ''}
      </div>
      <div class="font-mono font-black text-slate-900 text-xl tracking-wide">${esc(code)}</div>
    </div>
    <button onclick="showBarcodeModal('${code}', '${esc(viewTitle)}')" class="bg-${viewColor}-50 text-${viewColor}-700 hover:bg-${viewColor}-100 border border-${viewColor}-200 px-3 py-1.5 rounded-lg text-xs font-bold">表示</button>`;
  container.appendChild(div);
}

function predictBoxJan() {
  const input = document.getElementById('predict-input').value.trim();
  const container = document.getElementById('predict-results');
  container.innerHTML = '';
  if (!/^\d{12,14}$/.test(input)) {
    alert('12〜14桁の数字を入力してください');
    return;
  }
  
  const body = input.slice(0, -1);
  const lastNum = parseInt(body.slice(-1), 10);

  const offsets = [
    { offset: 1, label: '＋1 (箱JAN)', badge: '箱予測', desc: '単品 → 箱' },
    { offset: -1, label: '−1 (単品JAN)', badge: '単品予測', desc: '箱 → 単品' }
  ];

  offsets.forEach(item => {
    const newLast = (lastNum + item.offset + 10) % 10;
    const newBody = body.slice(0, -1) + newLast;
    const cd = calcCheckDigit(newBody);
    const predictedCode = newBody + cd;
    appendCodeCard(container, predictedCode, item.label, 'indigo', item.desc, item.badge);
  });

  addHistory('箱JAN予測(±1)', input);
}

/* 単品⇔箱JAN予測ページ内の検索・修正管理枠 */
function searchManageItem() {
  const q = (document.getElementById('manage-search-input')?.value || '').trim().toLowerCase();
  const list = document.getElementById('manage-result-list');
  if (!list) return;
  list.innerHTML = '';

  let items = db.products;
  if (q) {
    items = items.filter(p => p.name.toLowerCase().includes(q) || p.jan.includes(q) || (p.boxJan && p.boxJan.includes(q)));
  }

  if (items.length === 0) {
    list.innerHTML = `<div class="text-center py-4 text-slate-400 text-xs">データがありません</div>`;

  }

  items.forEach(item => {

      <div class="space-y-1">
        <div class="font-bold text-slate-800 text-sm">${esc(item.name)}</div>
        <div class="font-mono text-slate-500">JAN: <b>${esc(item.jan)}</b> ${item.boxJan ? `/ 箱: <b>${esc(item.boxJan)}</b>` : ''}</div>
        <div class="text-slate-500">¥${esc(item.price || '-')} | 入数: ${esc(item.qty || '-')}</div>
      </div>
      <div class="flex gap-1.5">
        <button onclick="editManageProduct('${esc(item.id)}')" class="bg-blue-100 hover:bg-blue-200 text-blue-800 px-2.5 py-1.5 rounded font-bold">編集</button>
        <button onclick="deleteManageProduct('${esc(item.id)}')" class="bg-red-100 hover:bg-red-200 text-red-600 px-2 py-1.5 rounded"><i class="fa-solid fa-trash"></i></button>
      </div>`;
    list.appendChild(div);

}

function editManageProduct(id) {
  const item = db.products.find(p => p.id === id);
  if (!item) return;
  document.getElementById('mp-id').value = item.id;
  document.getElementById('mp-name').value = item.name;
  document.getElementById('mp-jan').value = item.jan;

  document.getElementById('mp-price').value = item.price || '';
  document.getElementById('mp-qty').value = item.qty || '';
  document.getElementById('mp-memo').value = item.memo || '';

  document.getElementById('manage-form-container').scrollIntoView({ behavior: 'smooth' });
}

function closeManageForm() {
  document.getElementById('manage-form-container').classList.add('hidden');
}

function deleteManageProduct(id) {
  if (!confirm('削除しますか？')) return;
  db.products = db.products.filter(p => p.id !== id);
  saveDb();
  searchManageItem();
}

function saveManageProduct(e) {
  e.preventDefault();
  const id = document.getElementById('mp-id').value;
  const newP = {
    id: id || Date.now().toString(),
    name: document.getElementById('mp-name').value,
    jan: document.getElementById('mp-jan').value.trim(),
    boxJan: document.getElementById('mp-boxjan').value.trim(),
    price: document.getElementById('mp-price').value,
    qty: document.getElementById('mp-qty').value,
    memo: document.getElementById('mp-memo').value
  };
  const idx = db.products.findIndex(p => p.id === id);
  if (idx !== -1) db.products[idx] = newP;
  saveDb();
  closeManageForm();
  searchManageItem();
}

function convertITF(mode) {
  const val = document.getElementById('itf-input').value.trim();
  const labelEl = document.getElementById('itf-res-label');
  const valEl = document.getElementById('itf-res-val');
  const statusEl = document.getElementById('itf-check-status');
  if (!val) return;

  let result = "";
  if (mode === 'toJAN') {
    if (/^\d{14}$/.test(val)) {
      const janBody = val.slice(1, 13);
      result = janBody + calcCheckDigit(janBody);
      labelEl.textContent = "JAN (13桁)";
    } else { alert('14桁を入力してください'); return; }
  } else {
    if (/^\d{13}$/.test(val)) {
      const itfBody = '1' + val.slice(0, 12);
      result = itfBody + calcCheckDigit(itfBody);
      labelEl.textContent = "ITF (14桁)";
    } else { alert('13桁を入力してください'); return; }
  }

  valEl.textContent = result;
  const ok = isValidJan(result);
  statusEl.textContent = ok ? "✓ 正常" : "× チェックデジット不整合";
  statusEl.className = ok ? "text-xs text-emerald-600 font-bold" : "text-xs text-red-600 font-bold";
  document.getElementById('itf-result').classList.remove('hidden');
  try {
    JsBarcode("#itf-res-barcode", result, { format: result.length === 14 ? "ITF14" : "EAN13", width: 2, height: 50, displayValue: true });
  } catch (e) {}
  addHistory('ITF変換', `${val} -> ${result}`);
}

function solveMissingJan() {
  const raw = document.getElementById('missing-input').value.trim();
  const container = document.getElementById('missing-results');
  container.innerHTML = '';
  if (!raw.includes('?') && !raw.includes('*')) {
    alert('? または * を含めて入力してください');
    return;
  }
  const missingCount = (raw.match(/[\?\*]/g) || []).length;
  if (missingCount > 2) {
    alert('欠損桁は2桁までにしてください');
    return;
  }
  const matches = [];
  const max = Math.pow(10, missingCount);
  for (let i = 0; i < max; i++) {
    const fill = String(i).padStart(missingCount, '0');
    let k = 0;
    const candidate = raw.replace(/[\?\*]/g, () => fill[k++]);
    if (isValidJan(candidate)) matches.push(candidate);
  }
  if (matches.length === 0) {
    container.innerHTML = `<div class="text-center py-4 text-xs text-slate-500">候補なし</div>`;
    return;
  }
  matches.forEach(code => appendCodeCard(container, code, '', 'amber', '補完コード'));
  addHistory('欠損補完', raw);
}

/* JAN無し機能（名前・写真の新規および編集対応） */
function openFavForm(id = null, presetJan = '') {
  const form = document.getElementById('fav-form-container');
  form.classList.remove('hidden');

  if (id) {
    // 編集モード
    const item = db.favorites.find(f => f.id === id);
    if (!item) return;
    document.getElementById('fav-form-title').innerHTML = '<i class="fa-solid fa-pen"></i> JAN無し商品の編集';
    document.getElementById('fav-input-id').value = item.id;
    document.getElementById('fav-input-name').value = item.name;
    document.getElementById('fav-input-jan').value = item.jan;
    currentBase64Image = item.image || '';
    if (currentBase64Image) {
      document.getElementById('fav-img-preview').src = currentBase64Image;
      document.getElementById('fav-img-preview-wrap').classList.remove('hidden');
    } else {
      clearFavImage();
    }
  } else {
    // 新規追加モード
    document.getElementById('fav-form-title').innerHTML = '<i class="fa-solid fa-plus"></i> JAN無し商品の登録';
    document.getElementById('fav-input-id').value = '';
    document.getElementById('fav-input-name').value = presetJan ? `商品 (${presetJan})` : '';
    document.getElementById('fav-input-jan').value = presetJan;
    clearFavImage();
  }
  form.scrollIntoView({ behavior: 'smooth' });
}

function closeFavForm() {
  document.getElementById('fav-form-container').classList.add('hidden');
  document.getElementById('fav-input-id').value = '';
  document.getElementById('fav-input-name').value = '';
  document.getElementById('fav-input-jan').value = '';
  clearFavImage();
}

function previewFavImage(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.src = e.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const maxW = 300;
        const scale = maxW / img.width;
        canvas.width = maxW;
        canvas.height = img.height * scale;
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        currentBase64Image = canvas.toDataURL('image/jpeg', 0.7);
        document.getElementById('fav-img-preview').src = currentBase64Image;
        document.getElementById('fav-img-preview-wrap').classList.remove('hidden');
      };
    };
    reader.readAsDataURL(input.files[0]);
  }
}

function clearFavImage() {
  currentBase64Image = "";
  document.getElementById('fav-input-image').value = "";
  document.getElementById('fav-img-preview-wrap').classList.add('hidden');
}

function saveCustomFavorite() {
  const id = document.getElementById('fav-input-id').value;
  const name = document.getElementById('fav-input-name').value.trim();
  let jan = document.getElementById('fav-input-jan').value.trim();
  if (!name) return alert('商品名を入力してください');

  if (!jan) {
    jan = 'NOJAN-' + Date.now().toString().slice(-6);
  }

  if (id) {
    // 既存データの更新
    const idx = db.favorites.findIndex(f => f.id === id);
    if (idx !== -1) {
      db.favorites[idx] = { id, name, jan, image: currentBase64Image };
    }
  } else {
    // 新規データの追加
    db.favorites.unshift({
      id: Date.now().toString(),
      name,
      jan,
      image: currentBase64Image
    });
  }

  saveDb();
  closeFavForm();
  renderFavorites();
}

function renderFavorites() {
  const grid = document.getElementById('fav-grid');
  const query = (document.getElementById('fav-search-input')?.value || '').trim().toLowerCase();
  grid.innerHTML = '';

  let list = db.favorites;
  if (query) {
    list = list.filter(f => f.name.toLowerCase().includes(query) || f.jan.includes(query));
  }

  if (list.length === 0) {
    grid.innerHTML = `<div class="col-span-full text-center py-8 text-slate-400 text-sm">該当するデータなし</div>`;
    return;
  }
  list.forEach(fav => {
    const card = document.createElement('div');
    card.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between space-y-3";
    card.innerHTML = `
      <div class="flex gap-3 items-start">
        ${fav.image ? `<img src="${fav.image}" class="w-16 h-16 object-cover rounded-lg border border-slate-200 flex-shrink-0">` : '<div class="w-16 h-16 bg-slate-100 rounded-lg border border-slate-200 flex items-center justify-center text-slate-300 text-xs flex-shrink-0">No Img</div>'}
        <div class="flex-1 min-w-0">
          <div class="font-bold text-slate-800 text-base truncate">${esc(fav.name)}</div>
          <div class="text-xs font-mono text-slate-500 truncate">JAN: ${esc(fav.jan)}</div>
        </div>
        <div class="flex items-center gap-1">
          <button onclick="openFavForm('${esc(fav.id)}')" class="text-blue-500 hover:text-blue-700 p-1.5"><i class="fa-solid fa-pen-to-square"></i></button>
          <button onclick="removeFavorite('${esc(fav.id)}')" class="text-slate-300 hover:text-red-500 p-1.5"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>
      <button class="fav-show w-full bg-amber-50 hover:bg-amber-100 border border-amber-200 text-amber-800 font-bold py-2 rounded-lg text-xs flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-barcode text-base"></i> バーコード表示
      </button>`;
    card.querySelector('.fav-show').onclick = () => showBarcodeModal(fav.jan, fav.name);
    grid.appendChild(card);
  });
}

function removeFavorite(id) {
  if (!confirm('削除してよろしいですか？')) return;
  db.favorites = db.favorites.filter(f => f.id !== id);
  saveDb();
  renderFavorites();
}

function renderHistory() {
  const list = document.getElementById('history-list');
  list.innerHTML = '';
  if (db.history.length === 0) {
    list.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">履歴なし</div>`;
    return;
  }
  db.history.forEach(item => {
    const div = document.createElement('div');
    div.className = "bg-white px-4 py-3 rounded-lg border border-slate-200 flex justify-between items-center text-xs";
    div.innerHTML = `
      <div class="space-x-2">
        <span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-medium">${esc(item.type)}</span>
        <span class="font-mono font-bold text-slate-800">${esc(item.val)}</span>
      </div>
      <span class="text-slate-400">${esc(item.time)}</span>`;
    list.appendChild(div);
  });
}
function addHistory(type, val) {
  const now = new Date();
  const timeStr = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
  db.history.unshift({ type, val, time: timeStr });
  if (db.history.length > 30) db.history.pop();
  saveDb();
}
function clearHistory() { db.history = []; saveDb(); renderHistory(); }

function showBarcodeModal(code, title) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-subtext').textContent = code;
  document.getElementById('barcode-modal').classList.remove('hidden');
  try {
    let format = "EAN13";
    if (code.length === 8) format = "EAN8";
    if (code.length === 14) format = "ITF14";
    JsBarcode("#modal-barcode-svg", code, { format, width: 2.5, height: 80, displayValue: true });
  } catch (e) {
    try { JsBarcode("#modal-barcode-svg", code, { format: "CODE128", width: 2.5, height: 80, displayValue: true }); } catch (_) {}
  }
}
function closeModal() { document.getElementById('barcode-modal').classList.add('hidden'); }
</script>
