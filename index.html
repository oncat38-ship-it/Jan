<script>
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function loadJson(key) {
  try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch (_) { return []; }
}

let currentGroupId = localStorage.getItem('jan_group_id') || null;
let unsubscribeSnapshot = null;
let db = { products: loadJson('jan_products'), favorites: loadJson('jan_favorites'), history: loadJson('jan_history') };
let html5QrcodeScanner = null, isScanning = false, starting = false, torchOn = false;
let lastScannedCode = "", pendingLinkCode = "", lastRead = "", sameCount = 0;

if (db.products.length === 0) {
  db.products = [
    { id: '1', name: '緑茶 500ml', jan: '4901234567890', boxJan: '14901234567897', price: 140, qty: 24, memo: '常温棚 A-1' },
    { id: '2', name: 'ポテトチップス', jan: '4909876543210', boxJan: '14909876543217', price: 120, qty: 12, memo: 'お菓子コーナー' }
  ];
  saveDb();
}

function saveDb() {
  try {
    localStorage.setItem('jan_products', JSON.stringify(db.products));
    localStorage.setItem('jan_favorites', JSON.stringify(db.favorites));
    localStorage.setItem('jan_history', JSON.stringify(db.history));
  } catch (_) {}

  if (currentGroupId && window.firebaseEnabled) {
    const { dbFirestore, doc, setDoc } = window.firebaseAuth;
    setDoc(doc(dbFirestore, "groups", currentGroupId), {
      products: db.products,
      favorites: db.favorites,
      updatedAt: new Date().toISOString()
    }, { merge: true }).catch(err => console.error("Cloud save failed:", err));
  }
}

window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    if (currentGroupId && window.firebaseEnabled) {
      startGroupSync(currentGroupId);
    }
  }, 500);
});

function connectSimpleGroup() {

function switchTab(tabId) {

  if (tabId === 'fav') renderFavorites();

  if (tabId === 'search') renderSearchResults();

function calcCheckDigit(codeWithoutCD) {
  const rev = String(codeWithoutCD).split('').reverse();
  let sum = 0;
  for (let i = 0; i < rev.length; i++) {
    const n = parseInt(rev[i], 10);
    if (isNaN(n)) return null;
    sum += (i % 2 === 0) ? n * 3 : n;
  }
  return (10 - (sum % 10)) % 10;
}
function isValidJan(code) {
  if (!/^(\d{8}|\d{12}|\d{13}|\d{14})$/.test(code)) return false;
  return calcCheckDigit(code.slice(0, -1)) === parseInt(code.slice(-1), 10);
}

// 縦横対応スキャナー設定
function toggleCamera() { isScanning ? stopCamera() : startCamera(); }

function createScanner() {
  const F = Html5QrcodeSupportedFormats;
  return new Html5Qrcode("reader", {
    formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.ITF],          
    experimentalFeatures: { useBarCodeDetectorIfSupported: true },  
    verbose: false
  });
}

function onDecoded(text) {
  if (!isScanning) return;
  let code = String(text).trim();
  if (!/^\d+$/.test(code) || !isValidJan(code)) return;
  if (code.length === 12) code = '0' + code;
  if (code === lastRead) sameCount++; else { lastRead = code; sameCount = 1; }
  if (sameCount < 2) return;
  lastRead = ""; sameCount = 0;
  onScanSuccess(code);
}

async function startCamera() {
  if (starting) return;
  if (typeof Html5Qrcode === "undefined") {
    alert("ライブラリのロードに失敗しました。");
    return;
  }
  starting = true;
  document.getElementById('camera-placeholder').classList.add('hidden');
  document.getElementById('scan-status').textContent = '起動中...';
  document.getElementById('scan-status').className = 'text-xs px-2 py-1 bg-amber-100 text-amber-800 rounded-full font-semibold animate-pulse';

  const base = {
    fps: 20,
    disableFlip: true,
    qrbox: (w, h) => {
      const boxSize = Math.floor(Math.min(w, h) * 0.8);
      return { width: boxSize, height: boxSize };
    }
  };
  
  const hiRes = { 
    ...base, 
    videoConstraints: { 
      facingMode: "environment", 
      width: { ideal: 1920, min: 1280 }, 
      height: { ideal: 1080, min: 720 },
      advanced: [{ focusMode: "continuous" }]
    } 
  };

  const attempts = [
    () => [{ facingMode: "environment" }, hiRes],
    () => [{ facingMode: "environment" }, base],
    () => [{ facingMode: "user" }, base]
  ];

  let started = false, lastErr = null;
  for (const make of attempts) {
    try {
      html5QrcodeScanner = createScanner();
      const [cam, cfg] = make();
      isScanning = true;
      await html5QrcodeScanner.start(cam, cfg, onDecoded);
      started = true;
      break;
    } catch (e) {
      lastErr = e; isScanning = false;
      try { html5QrcodeScanner.clear(); } catch (_) {}
    }
  }

  starting = false;
  if (!started) {
    alert("カメラを起動できませんでした。");
    resetCameraUI();
    return;
  }
  document.getElementById('btn-toggle-camera').innerHTML = '<i class="fa-solid fa-stop"></i> <span>スキャン停止</span>';
  document.getElementById('btn-toggle-camera').className = 'flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 transition';
  document.getElementById('scan-status').textContent = 'スキャン中';
  setupCameraTools();
}

async function setupCameraTools() {
  try {
    const caps = html5QrcodeScanner.getRunningTrackCameraCapabilities();
    const torch = caps.torchFeature(), zoom = caps.zoomFeature();
    document.getElementById('btn-torch').style.display = torch.isSupported() ? 'block' : 'none';
    if (zoom.isSupported()) {
      const r = document.getElementById('zoom-range');
      r.min = zoom.min(); r.max = zoom.max(); r.step = zoom.step() || 0.1; r.value = zoom.min();
      document.getElementById('zoom-wrap').style.display = 'flex';
    } else {
      document.getElementById('zoom-wrap').style.display = 'none';
    }
    document.getElementById('cam-tools').style.display = (torch.isSupported() || zoom.isSupported()) ? 'flex' : 'none';
  } catch (_) {}
}

function toggleTorch() {
  try { torchOn = !torchOn; html5QrcodeScanner.getRunningTrackCameraCapabilities().torchFeature().apply(torchOn); } catch (_) {}
}
function setZoom(v) {
  try { html5QrcodeScanner.getRunningTrackCameraCapabilities().zoomFeature().apply(Number(v)); } catch (_) {}
}

function stopCamera() {
  const s = html5QrcodeScanner;
  isScanning = false;
  html5QrcodeScanner = null;
  if (!s) { resetCameraUI(); return; }
  s.stop().catch(e => console.error(e)).finally(() => {
    try { s.clear(); } catch (_) {}
    resetCameraUI();
  });
}

function resetCameraUI() {
  isScanning = false; starting = false; torchOn = false; lastRead = ""; sameCount = 0;
  document.getElementById('cam-tools').style.display = 'none';
  document.getElementById('camera-placeholder').classList.remove('hidden');
  document.getElementById('scan-status').textContent = '待機中';
  document.getElementById('scan-status').className = 'text-xs px-2 py-1 bg-emerald-100 text-emerald-800 rounded-full font-semibold';
  document.getElementById('btn-toggle-camera').innerHTML = '<i class="fa-solid fa-power-off"></i> <span>カメラ起動</span>';
  document.getElementById('btn-toggle-camera').className = 'flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 transition';
}

function onScanSuccess(decodedText) {
  stopCamera();
  playBeep();
  if (navigator.vibrate) navigator.vibrate(80);
  lastScannedCode = decodedText;
  addHistory('カメラ読取', decodedText);
  document.getElementById('scan-result-card').classList.remove('hidden');
  document.getElementById('scan-code-val').textContent = decodedText;
  const svgEl = document.getElementById('scan-barcode-svg');
  const errEl = document.getElementById('barcode-error-msg');
  try {
    let format = "EAN13";
    if (decodedText.length === 8) format = "EAN8";
    if (decodedText.length === 14) format = "ITF14";
    JsBarcode(svgEl, decodedText, { format, width: 2, height: 60, displayValue: true });
    errEl.classList.add('hidden');
  } catch (e) {
    try {
      JsBarcode(svgEl, decodedText, { format: "CODE128", width: 2, height: 60, displayValue: true });
      errEl.classList.add('hidden');
    } catch (err) { errEl.classList.remove('hidden'); }
  }
}
function closeScanResult() { document.getElementById('scan-result-card').classList.add('hidden'); }

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(1000, ctx.currentTime);
    osc.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.15);
  } catch (e) {}
}

function predictBoxJan() {
  const input = document.getElementById('predict-input').value.trim();
  const container = document.getElementById('predict-results');
  container.innerHTML = '';
  if (!/^\d{12,14}$/.test(input)) {
    alert('12〜14桁の数字を入力してください');
    return;
  }
  
  const body = input.slice(0, -1);
  const lastNum = parseInt(body.slice(-1), 10);

  const offsets = [
    { offset: 1, label: '＋1 (箱JAN)', badge: '箱予測', desc: '単品 → 箱' },
    { offset: -1, label: '−1 (単品JAN)', badge: '単品予測', desc: '箱 → 単品' }
  ];

  offsets.forEach(item => {
    const newLast = (lastNum + item.offset + 10) % 10;
    const newBody = body.slice(0, -1) + newLast;
    const cd = calcCheckDigit(newBody);
    const predictedCode = newBody + cd;
    appendCodeCard(container, predictedCode, item.label, 'indigo', item.desc, item.badge);
  });

  addHistory('箱JAN予測(±1)', input);
}

function convertITF(mode) {
  const val = document.getElementById('itf-input').value.trim();
  const labelEl = document.getElementById('itf-res-label');
  const valEl = document.getElementById('itf-res-val');
  const statusEl = document.getElementById('itf-check-status');
  if (!val) return;

  let result = "";
  if (mode === 'toJAN') {
    if (/^\d{14}$/.test(val)) {
      const janBody = val.slice(1, 13);
      result = janBody + calcCheckDigit(janBody);
      labelEl.textContent = "JAN (13桁)";
    } else { alert('14桁を入力してください'); return; }
  } else {
    if (/^\d{13}$/.test(val)) {
      const itfBody = '1' + val.slice(0, 12);
      result = itfBody + calcCheckDigit(itfBody);
      labelEl.textContent = "ITF (14桁)";
    } else { alert('13桁を入力してください'); return; }
  }

  valEl.textContent = result;
  const ok = isValidJan(result);
  statusEl.textContent = ok ? "✓ 正常" : "× チェックデジット不整合";
  statusEl.className = ok ? "text-xs text-emerald-600 font-bold" : "text-xs text-red-600 font-bold";
  document.getElementById('itf-btn-new').onclick = () => registerCodeDirect(result);
  document.getElementById('itf-btn-link').onclick = () => openLinkModal(result);
  document.getElementById('itf-result').classList.remove('hidden');
  try {
    JsBarcode("#itf-res-barcode", result, { format: result.length === 14 ? "ITF14" : "EAN13", width: 2, height: 50, displayValue: true });
  } catch (e) {}
  addHistory('ITF変換', `${val} -> ${result}`);
}

function solveMissingJan() {
  const raw = document.getElementById('missing-input').value.trim();
  const container = document.getElementById('missing-results');
  container.innerHTML = '';
  if (!raw.includes('?') && !raw.includes('*')) {
    alert('? または * を含めて入力してください');
    return;
  }
  const missingCount = (raw.match(/[\?\*]/g) || []).length;
  if (missingCount > 2) {
    alert('欠損桁は2桁までにしてください');
    return;
  }
  const matches = [];
  const max = Math.pow(10, missingCount);
  for (let i = 0; i < max; i++) {
    const fill = String(i).padStart(missingCount, '0');
    let k = 0;
    const candidate = raw.replace(/[\?\*]/g, () => fill[k++]);
    if (isValidJan(candidate)) matches.push(candidate);
  }
  if (matches.length === 0) {
    container.innerHTML = `<div class="text-center py-4 text-xs text-slate-500">候補なし</div>`;
    return;
  }
  matches.forEach(code => appendCodeCard(container, code, '', 'amber', '補完コード'));
  addHistory('欠損補完', raw);
}

    card.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between space-y-3";
    card.innerHTML = `
      <div class="flex justify-between items-start">
        <div>
          <div class="font-bold text-slate-800 text-base">${esc(fav.name)}</div>
          <div class="text-xs font-mono text-slate-500">${esc(fav.jan)}</div>
        </div>
        <button onclick="removeFavorite('${esc(fav.id)}')" class="text-slate-300 hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
      </div>
      <button class="fav-show w-full bg-amber-50 hover:bg-amber-100 border border-amber-200 text-amber-800 font-bold py-2 rounded-lg text-xs flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-barcode text-base"></i> 表示
      </button>`;
    card.querySelector('.fav-show').onclick = () => showBarcodeModal(fav.jan, fav.name);
    grid.appendChild(card);
  });
}
function removeFavorite(id) {
  db.favorites = db.favorites.filter(f => f.id !== id);
  saveDb();
  renderFavorites();
}

function renderHistory() {
  const list = document.getElementById('history-list');
  list.innerHTML = '';
  if (db.history.length === 0) {
    list.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">履歴なし</div>`;
    return;
  }
  db.history.forEach(item => {
    const div = document.createElement('div');
    div.className = "bg-white px-4 py-3 rounded-lg border border-slate-200 flex justify-between items-center text-xs";
    div.innerHTML = `
      <div class="space-x-2">
        <span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-medium">${esc(item.type)}</span>
        <span class="font-mono font-bold text-slate-800">${esc(item.val)}</span>
      </div>
      <span class="text-slate-400">${esc(item.time)}</span>`;
    list.appendChild(div);
  });
}
function addHistory(type, val) {
  const now = new Date();
  const timeStr = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
  db.history.unshift({ type, val, time: timeStr });
  if (db.history.length > 30) db.history.pop();
  saveDb();
}
function clearHistory() { db.history = []; saveDb(); renderHistory(); }

function showBarcodeModal(code, title) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-subtext').textContent = code;
  document.getElementById('barcode-modal').classList.remove('hidden');
  try {
    let format = "EAN13";
    if (code.length === 8) format = "EAN8";
    if (code.length === 14) format = "ITF14";
    JsBarcode("#modal-barcode-svg", code, { format, width: 2.5, height: 80, displayValue: true });
  } catch (e) {
    try { JsBarcode("#modal-barcode-svg", code, { format: "CODE128", width: 2.5, height: 80, displayValue: true }); } catch (_) {}
  }
}
function closeModal() { document.getElementById('barcode-modal').classList.add('hidden'); }
</script>
</body>
